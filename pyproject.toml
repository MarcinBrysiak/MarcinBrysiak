[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketing-ai"
version = "0.1.0"
description = "Internal AI solutions for marketing teams"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "components", "config", "dashboards", "workflows"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "agents", "workflows", "components"]
addopts = "--cov=. --cov-report=term-missing --cov-omit=*/tests/*,*/conftest.py"

[tool.coverage.run]
omit = ["*/tests/*", "*/conftest.py", ".venv/*"]
